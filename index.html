							// } else {
							// 	screen.value ="RAD";
							// }
						}




						let timer = null
			// or this			// let timer;
						function showDateTime() {

							// if clock is running already, stop it

							if (timer) {
								clearInterval(timer);
								timer = null;
								screen.value = "";
								screen.style.fontSize = "32";

								// your normal calculator fontsize

								return;
							}

							// start the clock
							clearInterval(timer);
							timer = setInterval(function() {
								let now = new Date();

								let date = now.getDate();
								let month =

								now.toLocaleString(undefined, { month: 'short' 
							});
								let year = now.getFullYear();

								let hours = now.getHours();
								let ampm = "AM";

								if (hours >= 12) {
									ampm ="PM";

								}
								if (hours > 12) {
									hours = hours - 12;
								}
								if (hours == 0) {
									hours = 12;
								}
								let minutes = now.getMinutes();
								let seconds = now.getSeconds();

								if (hours < 10) hours = "0" + hours;
								if (minutes < 10) minutes = "0" + minutes;
								if (seconds < 10 ) seconds = "0" + seconds;

								// Reduce font size

								screen.style.fontSize = "23px";

								screen.value =
								date + " " + month + " " + year + "\n" +
								hours + ":" + minutes + ":" + seconds + " " + ampm;
							},  1000);
						}

				
			
				
			

		
				
				

				

		
				
	</script>
